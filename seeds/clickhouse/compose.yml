name: data-peek-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: datapeek
      CLICKHOUSE_PASSWORD: smoketest
      CLICKHOUSE_DB: acme_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '58123:8123'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', "clickhouse-client --user datapeek --password smoketest -q \"SELECT count() FROM acme_analytics.\\`odd-names\\`\" | grep -q 3"]
      interval: 2s
      timeout: 5s
      retries: 60
