name: data-peek-clickhouse-ssh-tls

# Companion stack for the SSH/TLS smoke suite: one ClickHouse serving both
# plain HTTP (8123, internal only) and HTTPS (8443, self-signed test CA), plus
# an SSH bastion that can reach it over the compose network. Kept separate
# from compose.yml so the default local stack stays one container.

services:
  clickhouse-tls:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: datapeek
      CLICKHOUSE_PASSWORD: smoketest
      CLICKHOUSE_DB: acme_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '58443:8443'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./tls/server.crt:/etc/clickhouse-server/certs/server.crt:ro
      - ./tls/server.key:/etc/clickhouse-server/certs/server.key:ro
      - ./tls/https.xml:/etc/clickhouse-server/config.d/https.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', "clickhouse-client --user datapeek --password smoketest -q \"SELECT count() FROM acme_analytics.\\`odd-names\\`\" | grep -q 3"]
      interval: 2s
      timeout: 5s
      retries: 60

  ssh-bastion:
    image: linuxserver/openssh-server:version-10.3_p1-r1
    environment:
      PUID: '1000'
      PGID: '1000'
      USER_NAME: tunnel
      PUBLIC_KEY_FILE: /keys/id_rsa.pub
      PASSWORD_ACCESS: 'false'
      SUDO_ACCESS: 'false'
    ports:
      - '52222:2222'
    volumes:
      - ./ssh/id_rsa.pub:/keys/id_rsa.pub:ro
      - ./sshd:/config/sshd/sshd_config.d:ro
    depends_on:
      clickhouse-tls:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/2222 && head -c 4 <&3 | grep -q SSH"']
      interval: 2s
      timeout: 5s
      retries: 30
